---
- name: Encrypt Secret via AAP Job Template
  hosts: localhost
  gather_facts: false

  vars:
    # Set via AAP Survey Prompt (Type: Password)
    raw_secret: "{{ vault_password }}"
    
    # Variable name to label the encrypted block
    encrypted_var_name: "{{ my_secret_variable }}"

  tasks:
    - name: Create temp file for vault pass
      ansible.builtin.tempfile:
        state: file
        suffix: .vault_pass
      register: temp_vault_file
      no_log: true

    - name: Execute encryption block
      block:
        - name: Write injected vault password to temp file
          ansible.builtin.copy:
            content: "{{ aap_vault_pass }}"
            dest: "{{ temp_vault_file.path }}"
            mode: '0600'
          no_log: true

        - name: Encrypt secret string via stdin
          ansible.builtin.command:
            cmd: >-
              ansible-vault encrypt_string
              --vault-password-file "{{ temp_vault_file.path }}"
              --name "{{ encrypted_var_name }}"
          args:
            stdin: "{{ raw_secret }}"
          register: vault_result
          no_log: true

        - name: Print encrypted YAML output
          ansible.builtin.debug:
            msg: "{{ vault_result.stdout_lines }}"

      always:
        - name: Clean up temp vault file
          ansible.builtin.file:
            path: "{{ temp_vault_file.path }}"
            state: absent
          no_log: true
