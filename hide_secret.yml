---
- name: Encrypt Secret via AAP Job Template
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Create temp file for vault pass
      ansible.builtin.tempfile:
        state: file
        suffix: .vault_pass
      register: temp_vault_file

    - name: Execute encryption block
      block:
        - name: Write injected vault password to temp file
          ansible.builtin.copy:
            content: "{{ my_vault_secret }}"
            dest: "{{ temp_vault_file.path }}"
            mode: '0600'
          no_log: true

        - name: Encrypt secret string via stdin
          ansible.builtin.command:
            cmd: >-
              ansible-vault encrypt_string
              --vault-password-file "{{ temp_vault_file.path }}"
              --name "my_secret_variable"
            stdin: "{{ my_secret_variable }}"
          register: vault_result
          no_log: true

        - name: Clean up blank lines, leading spaces, and force key name
          ansible.builtin.set_fact:
            clean_vault_output: >-
              my_secret_variable: !vault |
              {{ vault_result.stdout | regex_replace('\n\s*\n', '\n') | regex_replace('(?m)^[ \t]+', '') }}

        - name: Print raw YAML block for GitHub or Decryption Survey
          ansible.builtin.debug:
            var: clean_vault_output

      always:
        - name: Clean up temp vault file
          ansible.builtin.file:
            path: "{{ temp_vault_file.path }}"
            state: absent
          when: temp_vault_file.path is defined
