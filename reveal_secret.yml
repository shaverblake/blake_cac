---
- name: Decrypt Secret via AAP Job Template
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Create temp file for vault pass
      ansible.builtin.tempfile:
        state: file
        suffix: .vault_pass
      register: temp_vault_file

    - name: Create temp file for encrypted payload
      ansible.builtin.tempfile:
        state: file
        suffix: .vault_payload
      register: temp_payload_file

    - name: Execute decryption block
      block:
        - name: Extract injected vault password to temp file
          ansible.builtin.copy:
            content: "{{ (ansible_play_vault_passwords | default({}))['default'] | default(my_vault_secret | default('')) }}\n"
            dest: "{{ temp_vault_file.path }}"
            mode: '0600'
          no_log: true

        - name: Write encrypted payload to temp file
          ansible.builtin.copy:
            content: "{{ my_secret_variable }}\n"
            dest: "{{ temp_payload_file.path }}"
            mode: '0600'

        - name: Decrypt payload file directly
          ansible.builtin.command:
            cmd: >-
              ansible-vault decrypt
              --vault-password-file "{{ temp_vault_file.path }}"
              "{{ temp_payload_file.path }}"
          register: vault_result
          no_log: true

        - name: Read decrypted secret
          ansible.builtin.slurp:
            src: "{{ temp_payload_file.path }}"
          register: decrypted_content

        - name: Print decrypted plain text
          ansible.builtin.debug:
            msg: "{{ decrypted_content.content | b64decode }}"

      always:
        - name: Clean up temp files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ temp_vault_file.path }}"
            - "{{ temp_payload_file.path }}"
          when: item is defined
