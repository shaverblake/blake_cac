---
- name: Decrypt Secret via AAP Job Template
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Create temp file for vault pass
      ansible.builtin.tempfile:
        state: file
        suffix: .vault_pass
      register: temp_vault_file

    - name: Execute decryption block
      block:
        - name: Write injected vault password to temp file
          ansible.builtin.copy:
            content: "{{ my_vault_secret }}"
            dest: "{{ temp_vault_file.path }}"
            mode: '0600'
          no_log: true

        - name: Decrypt secret string via stdin
          ansible.builtin.command:
            cmd: >-
              ansible-vault decrypt
              --vault-password-file "{{ temp_vault_file.path }}"
              -
            stdin: "{{ my_encrypted_secret }}"
          register: vault_result

        - name: Print decrypted plain text
          ansible.builtin.debug:
            var: vault_result.stdout

      always:
        - name: Clean up temp vault file
          ansible.builtin.file:
            path: "{{ temp_vault_file.path }}"
            state: absent
          when: temp_vault_file.path is defined
